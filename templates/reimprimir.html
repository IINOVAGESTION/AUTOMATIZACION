<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>RNDC Automático - Reimprimir</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', 'Segoe UI', Roboto, Arial, sans-serif;
    background: #1c1b19; color: #c9d1d9; margin: 0; padding: 0;
  }
  .contenedor { max-width: 640px; margin: 2rem auto; padding: 0 1.5rem; }
  .tarjeta {
    background: #232220; border: 1px solid #333; border-radius: 12px; padding: 1.5rem;
  }
  .tarjeta h2 { margin-top: 0; font-size: 1.05rem; color: #e6e6e6; }
  label { display: block; font-size: 0.85rem; color: #aaa; margin-bottom: 0.3rem; }
  input[type=text], select {
    width: 100%; padding: 0.6rem 0.7rem; border-radius: 7px; border: 1px solid #3a3a3a;
    background: #171614; color: #e6e6e6; font-size: 0.95rem; margin-bottom: 1rem;
  }
  button {
    background: #ff6a00; color: #1c1b19; border: none; border-radius: 7px;
    padding: 0.65rem 1.2rem; font-weight: 700; font-size: 0.9rem; cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: #ff8534; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #resultado { margin-top: 1rem; font-size: 0.88rem; }
  #resultado.ok { color: #3fb950; }
  #resultado.error { color: #f85149; }
  #resultado.cargando { color: #ff6a00; }
  #visor_pdf { display: none; margin-top: 1.5rem; }
  #visor_pdf iframe { width: 100%; height: 75vh; border: 1px solid #333; border-radius: 10px; background: #fff; }
</style>
</head>
<body>
{% set bs_pagina = 'reimprimir' %}{% set bs_subtitulo = 'Reimprimir' %}{% include '_barra_superior.html' %}

  <div class="contenedor">
    <div class="tarjeta">
      <h2>🖨️ Reimprimir una Remesa o Manifiesto</h2>
      <p style="font-size:0.85rem; opacity:0.75; margin-top:-0.5rem;">
        Para cuando se perdió el PDF original o hace falta una copia extra. Solo necesitas el radicado.
      </p>

      {% if not rndc_vinculado %}
      <label>Usuario del RNDC</label>
      <input type="text" id="usuario_rndc">
      <label>Contraseña del RNDC</label>
      <input type="text" id="password_rndc">
      {% endif %}

      <label>¿Qué es?</label>
      <select id="tipo_documento">
        <option value="manifiesto">Manifiesto</option>
        <option value="remesa">Remesa</option>
      </select>

      <label>Consecutivo</label>
      <input type="text" id="radicado" placeholder="ej. AF46561" value="{{ request.args.get('consecutivo', '') }}">

      <button id="btn_reimprimir" onclick="reimprimir()">🖨️ Reimprimir</button>

      <div id="resultado"></div>
    </div>

    <div id="visor_pdf">
      <iframe id="iframe_pdf"></iframe>
    </div>
  </div>

<script>
async function reimprimir() {
    var boton = document.getElementById('btn_reimprimir');
    var resultado = document.getElementById('resultado');
    var radicado = document.getElementById('radicado').value.trim();
    var tipoDocumento = document.getElementById('tipo_documento').value;

    if (!radicado) {
        alert('Escribe el radicado a reimprimir.');
        return;
    }

    var datos = new FormData();
    datos.append('radicado', radicado);
    datos.append('tipo_documento', tipoDocumento);
    var campoUsuario = document.getElementById('usuario_rndc');
    var campoPassword = document.getElementById('password_rndc');
    if (campoUsuario) datos.append('usuario_rndc', campoUsuario.value.trim());
    if (campoPassword) datos.append('password_rndc', campoPassword.value.trim());

    boton.disabled = true;
    resultado.className = 'cargando';
    resultado.textContent = '⏳ Abriendo el navegador y buscando el PDF... (puede tardar hasta un minuto)';
    document.getElementById('visor_pdf').style.display = 'none';

    try {
        var resp = await fetch('{{ url_for("reimprimir_route") }}', { method: 'POST', body: datos });
        var r = await resp.json();
        if (r.ok) {
            resultado.className = 'ok';
            resultado.textContent = '✅ PDF encontrado: ' + r.archivo;
            document.getElementById('iframe_pdf').src = "{{ url_for('ver_pdf') }}?archivo=" + encodeURIComponent(r.archivo);
            document.getElementById('visor_pdf').style.display = 'block';
            document.getElementById('visor_pdf').scrollIntoView({behavior: 'smooth'});
        } else {
            resultado.className = 'error';
            resultado.textContent = '❌ ' + (r.error || 'No se pudo reimprimir.');
        }
    } catch (e) {
        resultado.className = 'error';
        resultado.textContent = '⚠️ Error de conexión.';
    } finally {
        boton.disabled = false;
    }
}
</script>
</body>
</html>
