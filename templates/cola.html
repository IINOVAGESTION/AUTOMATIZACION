<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>RNDC Automático - Fila de viajes</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', 'Segoe UI', Roboto, Arial, sans-serif;
    background: #1c1b19; color: #ddd8cd; margin: 0; padding: 0;
  }
  .contenedor { max-width: 100%; margin: 1.5rem auto; padding: 0 2rem; display: flex; flex-direction: column; gap: 1.2rem; }
  h1 { margin: 0; font-size: 1.5rem; font-weight: 700; color: #e6e6e6; }
  .fl-oculto { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Contadores */
  .fl-contadores { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.9rem; }
  .fl-contador { background: #232220; border: 1px solid #333; border-radius: 12px; padding: 0.9rem 1.1rem; display: flex; flex-direction: column; gap: 0.2rem; }
  .fl-contador-nombre { font-size: 0.75rem; color: #918c80; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  .fl-contador-numero { font-size: 1.9rem; font-weight: 700; line-height: 1.1; color: #e6e6e6; }
  .fl-contador-numero.exito { color: #3fb950; }
  .fl-contador-numero.error { color: #ff6b6b; }
  .fl-contador-numero.curso { color: #ff6a00; }

  /* Buscador y filtros */
  .fl-herramientas { display: flex; gap: 0.8rem; align-items: center; flex-wrap: wrap; }
  .fl-buscador { position: relative; flex: 1 1 340px; min-width: 0; }
  .fl-buscador svg { position: absolute; left: 14px; top: 13px; }
  .fl-buscador input {
    width: 100%; min-height: 44px; padding: 0 14px 0 42px; background: #171614; color: #e6e6e6;
    border: 1px solid #3a3a3a; border-radius: 8px; font: inherit; font-size: 0.9rem;
  }
  .fl-buscador input::placeholder { color: #8a8a8a; }
  .fl-buscador input:focus-visible, .fl-chip:focus-visible, .fl-boton:focus-visible, .fl-titulo:focus-visible, .fl-copiar:focus-visible { outline: 2px solid #ff6a00; outline-offset: 2px; }
  .fl-filtros { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .fl-chip {
    min-height: 44px; padding: 0 1rem; background: transparent; color: #c9d1d9; border: 1px solid #3a3733;
    border-radius: 22px; font: inherit; font-size: 0.82rem; font-weight: 500; cursor: pointer;
  }
  .fl-chip:hover { background: #242220; }
  .fl-chip[aria-pressed="true"] { background: #2a2822; border-color: #ff6a00; color: #e6e6e6; font-weight: 600; }

  /* Tarjetas */
  .fl-lista { display: flex; flex-direction: column; gap: 0.75rem; }
  .fl-tarjeta {
    background: #232220; border: 1px solid #333; border-radius: 12px; padding: 1rem 1.25rem;
    display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; transition: border-color 0.15s;
  }
  .fl-tarjeta:hover { border-color: #4a4640; }
  .fl-tarjeta.con-error { border-color: #5a2a2a; }
  .fl-icono { width: 40px; height: 40px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .fl-icono.exito { background: #16301c; color: #3fb950; }
  .fl-icono.error { background: #3a1a1a; color: #ff6b6b; }
  .fl-icono.curso { background: #3a2a14; color: #ff6a00; }
  .fl-icono.espera { background: #2a2a2a; color: #c9c9c9; }
  .fl-icono.curso svg.fl-girando { animation: fl-girar 1.4s linear infinite; }
  @keyframes fl-girar { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .fl-icono.curso svg.fl-girando { animation: none; } }
  .fl-cuerpo { flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 0.35rem; }
  .fl-titulo { font-size: 1rem; font-weight: 700; color: #e6e6e6; text-decoration: none; overflow-wrap: anywhere; }
  .fl-titulo:hover { text-decoration: underline; }
  .fl-titulo .fl-numero { color: #918c80; font-weight: 500; margin-right: 0.35rem; }
  .fl-detalle { font-size: 0.82rem; color: #918c80; overflow-wrap: anywhere; }
  .fl-motivo { font-size: 0.82rem; color: #ff8a8a; font-weight: 500; overflow-wrap: anywhere; }
  .fl-radicados { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.15rem; }
  .fl-copiar {
    min-height: 32px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; background: #171614;
    color: #c9d1d9; border: 1px solid #3a3733; border-radius: 6px; font: inherit; font-size: 0.75rem; font-weight: 500; cursor: pointer;
  }
  .fl-copiar:hover { border-color: #ff6a00; }
  .fl-estado { display: flex; flex-direction: column; align-items: flex-end; gap: 0.25rem; }
  .fl-etiqueta { font-size: 0.75rem; font-weight: 700; padding: 0.25rem 0.75rem; border-radius: 14px; white-space: nowrap; }
  .fl-etiqueta.exito { background: #16301c; color: #3fb950; }
  .fl-etiqueta.error { background: #3a1a1a; color: #ff6b6b; }
  .fl-etiqueta.curso { background: #3a2a14; color: #ff6a00; }
  .fl-etiqueta.espera { background: #2a2a2a; color: #c9c9c9; }
  .fl-paso { font-size: 0.75rem; color: #918c80; }
  .fl-acciones { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .fl-boton {
    min-height: 44px; display: inline-flex; align-items: center; padding: 0 1rem; background: transparent;
    color: #e6e6e6; border: 1px solid #3a3733; border-radius: 8px; font: inherit; font-size: 0.82rem; font-weight: 600;
    text-decoration: none; cursor: pointer; white-space: nowrap;
  }
  .fl-boton:hover { background: #2a2822; }
  .fl-boton.destacado { color: #ff6a00; border-color: #ff6a00; font-weight: 700; }
  .fl-boton.destacado:hover { background: rgba(255,106,0,0.12); }
  .fl-boton.discreto { color: #918c80; border-color: transparent; font-weight: 500; }
  .fl-boton.discreto:hover { color: #e6e6e6; }
  .fl-vacio { color: #918c80; text-align: center; padding: 2rem; }
  @media (max-width: 760px) { .fl-contadores { grid-template-columns: repeat(2, minmax(0, 1fr)); } .contenedor { padding: 0 1rem; } }
</style>
</head>
<body>
{% set bs_pagina = 'fila' %}{% set bs_subtitulo = 'Fila de viajes' %}{% include '_barra_superior.html' %}

  <main class="contenedor">
    <h1>Fila de viajes</h1>

    <div class="fl-contadores" id="fl_contadores" aria-label="Resumen de la fila"></div>

    <div class="fl-herramientas">
      <div class="fl-buscador">
        <label class="fl-oculto" for="buscador_input">Buscar viajes</label>
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#918c80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" id="buscador_input" placeholder="Buscar por cliente, placa, consecutivo, ciudad..." oninput="pintarLista()">
      </div>
      <div class="fl-filtros" id="fl_filtros" role="group" aria-label="Filtrar por estado"></div>
    </div>

    <div id="lista_trabajos" class="fl-lista"><div class="fl-vacio">Cargando...</div></div>
  </main>

<script>
var ultimosDatos = [];
var filtroActivo = 'todos';
var ultimoDibujo = '';

// Los textos los escribe una persona (cliente, ciudades) o vienen del RNDC
// (motivo del error): se escapan antes de meterlos en el HTML para que
// ningún símbolo raro (< > " &) rompa o altere la fila.
function escaparHtml(texto) {
    return String(texto).replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

var ICONOS = {
    ok: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>',
    alerta: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>',
    girar: '<svg class="fl-girando" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></svg>',
    reloj: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    copiar: '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 9h11v11H9zM5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>'
};

// Tres grupos que cubren TODOS los viajes (ninguno queda sin categoría):
// en_curso = pendientes y corriendo; terminados = con éxito; error = el resto.
function categoria(t) {
    if (t.estado === 'pendiente' || t.estado === 'corriendo') return 'en_curso';
    return t.ok === true ? 'terminados' : 'error';
}
function formatoDuracion(seg) {
    if (seg === null || seg === undefined) return '';
    if (seg < 60) return seg + ' s';
    var m = Math.floor(seg / 60), s = seg % 60;
    return m + ' min' + (s ? ' ' + s + ' s' : '');
}

function pintarContadores() {
    var n = {todos: ultimosDatos.length, en_curso: 0, error: 0, terminados: 0};
    ultimosDatos.forEach(function (t) { n[categoria(t)]++; });
    document.getElementById('fl_contadores').innerHTML =
        '<div class="fl-contador"><div class="fl-contador-nombre">En la fila</div><div class="fl-contador-numero">' + n.todos + '</div></div>' +
        '<div class="fl-contador"><div class="fl-contador-nombre">Terminados</div><div class="fl-contador-numero exito">' + n.terminados + '</div></div>' +
        '<div class="fl-contador"><div class="fl-contador-nombre">Con error</div><div class="fl-contador-numero error">' + n.error + '</div></div>' +
        '<div class="fl-contador"><div class="fl-contador-nombre">En curso</div><div class="fl-contador-numero curso">' + n.en_curso + '</div></div>';
    var chips = [['todos', 'Todos'], ['en_curso', 'En curso'], ['error', 'Con error'], ['terminados', 'Terminados']];
    document.getElementById('fl_filtros').innerHTML = chips.map(function (c) {
        return '<button type="button" class="fl-chip" data-filtro="' + c[0] + '" aria-pressed="' + (filtroActivo === c[0]) + '">' +
            c[1] + ' · ' + n[c[0]] + '</button>';
    }).join('');
}

function tarjeta(t) {
    var cat = categoria(t);
    var claseIcono = cat === 'terminados' ? 'exito' : (cat === 'error' ? 'error' : (t.estado === 'corriendo' ? 'curso' : 'espera'));
    var icono = cat === 'terminados' ? ICONOS.ok : (cat === 'error' ? ICONOS.alerta : (t.estado === 'corriendo' ? ICONOS.girar : ICONOS.reloj));
    var textoEstado = cat === 'terminados' ? 'Terminado' : (cat === 'error' ? 'Con error' : (t.estado === 'corriendo' ? 'Corriendo…' : 'Pendiente'));
    var enlaceProgreso = '{{ url_for("progreso_trabajo") }}?id=' + t.id;
    var enlaceReintentar = '{{ url_for("reintentar_trabajo", id_trabajo=999999) }}'.replace('999999', t.id);

    var partes = [];
    if (t.detalle) partes.push(escaparHtml(t.detalle));
    if (t.estado === 'pendiente') partes.push('esperando turno');
    else if (t.estado === 'corriendo' && t.hora) partes.push('empezó ' + t.hora);
    else if (t.estado === 'terminado') {
        if (t.hora) partes.push(t.hora);
        if (t.duracion !== null) partes.push(formatoDuracion(t.duracion));
    }

    var cuerpo = '<a class="fl-titulo" href="' + enlaceProgreso + '"><span class="fl-numero">#' + t.id + '</span>' + escaparHtml(t.titulo) + '</a>' +
        '<div class="fl-detalle">' + partes.join(' · ') + '</div>';
    if (cat === 'error' && t.motivo) cuerpo += '<div class="fl-motivo">' + escaparHtml(t.motivo) + '</div>';
    if (cat === 'terminados' && t.radicados.length) {
        cuerpo += '<div class="fl-radicados">' + t.radicados.map(function (r) {
            return '<button type="button" class="fl-copiar" data-copiar="' + r.numero + '" aria-label="Copiar radicado de ' +
                (r.tipo === 'Remesa' ? 'la remesa ' : 'el manifiesto ') + r.numero + '">' + ICONOS.copiar + r.tipo + ' ' + r.numero + '</button>';
        }).join('') + '</div>';
    }

    var estado = '<div class="fl-estado"><span class="fl-etiqueta ' + claseIcono + '">' + textoEstado + '</span>' +
        (t.paso ? '<span class="fl-paso">' + escaparHtml(t.paso) + '</span>' : '') + '</div>';

    var acciones = '';
    if (t.estado !== 'terminado') {
        acciones = '<a class="fl-boton" href="' + enlaceProgreso + '">Ver progreso</a>';
    } else if (cat === 'error') {
        acciones = '<a class="fl-boton destacado" href="' + enlaceReintentar + '" title="Volver al formulario con estos datos para corregir y ejecutar de nuevo">Corregir y reintentar</a>' +
            '<button type="button" class="fl-boton" data-copiar-log="' + t.id + '">Copiar log</button>';
    } else {
        if (t.es_cola) acciones += '<a class="fl-boton" href="' + enlaceProgreso + '">Ver detalle</a>';
        else if (t.consecutivo) acciones += '<a class="fl-boton" href="{{ url_for("reimprimir_pagina") }}?consecutivo=' + encodeURIComponent(t.consecutivo) + '">Reimprimir</a>';
        acciones += '<a class="fl-boton discreto" href="' + enlaceReintentar + '" title="Volver al formulario con estos datos para corregir y ejecutar de nuevo">Corregir y reintentar</a>';
    }

    return '<div class="fl-tarjeta' + (cat === 'error' ? ' con-error' : '') + '">' +
        '<div class="fl-icono ' + claseIcono + '">' + icono + '</div>' +
        '<div class="fl-cuerpo">' + cuerpo + '</div>' + estado +
        '<div class="fl-acciones">' + acciones + '</div></div>';
}

function pintarLista() {
    var filtroTexto = document.getElementById('buscador_input').value.trim().toUpperCase();
    var firma = JSON.stringify([ultimosDatos, filtroActivo, filtroTexto]);
    if (firma === ultimoDibujo) return;   // nada cambió: no se vuelve a dibujar (así no se pierde un "✓ Copiado" ni el foco)
    ultimoDibujo = firma;

    pintarContadores();
    var cont = document.getElementById('lista_trabajos');
    var visibles = ultimosDatos.filter(function (t) {
        if (filtroActivo !== 'todos' && categoria(t) !== filtroActivo) return false;
        if (!filtroTexto) return true;
        return [t.descripcion, t.titulo, t.detalle, '#' + t.id].some(function (campo) {
            return String(campo || '').toUpperCase().indexOf(filtroTexto) !== -1;
        });
    });
    if (!ultimosDatos.length) {
        cont.innerHTML = '<div class="fl-vacio">No hay viajes en la fila todavía.</div>';
    } else if (!visibles.length) {
        cont.innerHTML = '<div class="fl-vacio">Ningún viaje coincide con ese filtro o búsqueda.</div>';
    } else {
        cont.innerHTML = visibles.slice().reverse().map(tarjeta).join('');
    }
}

// --- Copiar (radicados y log completo) ---
function copiarConTextarea(texto) {
    return new Promise(function (resolve, reject) {
        var area = document.createElement('textarea');
        area.value = texto; area.style.position = 'fixed'; area.style.opacity = '0';
        document.body.appendChild(area); area.select();
        var copiado = false;
        try { copiado = document.execCommand('copy'); } catch (e) { copiado = false; }
        document.body.removeChild(area);
        if (copiado) { resolve(); } else { reject(new Error('copiado bloqueado')); }
    });
}
function copiarTexto(texto) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(texto).catch(function () { return copiarConTextarea(texto); });
    }
    return copiarConTextarea(texto);
}
function avisarEnBoton(boton, mensaje) {
    var original = boton.innerHTML;
    boton.innerHTML = mensaje;
    setTimeout(function () { boton.innerHTML = original; boton.disabled = false; }, 1600);
}

document.getElementById('lista_trabajos').addEventListener('click', function (e) {
    var boton = e.target.closest('button');
    if (!boton) return;
    if (boton.dataset.copiar) {
        copiarTexto(boton.dataset.copiar)
            .then(function () { avisarEnBoton(boton, '✓ Copiado'); })
            .catch(function () { avisarEnBoton(boton, 'No se pudo copiar'); });
    } else if (boton.dataset.copiarLog) {
        boton.disabled = true;
        fetch('{{ url_for("reporte_log") }}?id=' + encodeURIComponent(boton.dataset.copiarLog))
            .then(function (r) { return r.json(); })
            .then(function (r) { if (!r.ok) throw new Error(r.error || 'sin datos'); return copiarTexto(r.texto); })
            .then(function () { avisarEnBoton(boton, '✓ Log copiado'); })
            .catch(function () { avisarEnBoton(boton, 'No se pudo copiar'); });
    }
});
document.getElementById('fl_filtros').addEventListener('click', function (e) {
    var chip = e.target.closest('button[data-filtro]');
    if (!chip) return;
    filtroActivo = chip.dataset.filtro;
    pintarLista();
    var nuevo = document.querySelector('#fl_filtros button[data-filtro="' + filtroActivo + '"]');
    if (nuevo) nuevo.focus();   // los botones se redibujan: el foco vuelve al que se acaba de elegir
});

function refrescarDesdeServidor() {
    fetch("{{ url_for('estado') }}")
        .then(r => r.json())
        .then(data => {
            try {
                ultimosDatos = data.trabajos;
                pintarLista();
            } catch (errorAlDibujar) {
                console.error('Error al dibujar la fila:', errorAlDibujar);
            }
            setTimeout(refrescarDesdeServidor, 2000);
        })
        .catch(function (errorDeRed) {
            console.error('Error consultando la fila:', errorDeRed);
            setTimeout(refrescarDesdeServidor, 2500);
        });
}
pintarLista();
refrescarDesdeServidor();
</script>
</body>
</html>
